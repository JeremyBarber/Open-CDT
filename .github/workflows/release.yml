name: Build, Test & Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Open-CDT.slnx

      - name: Build solution (Release)
        run: dotnet build Open-CDT.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test Open-CDT.slnx --configuration Release --no-build --verbosity normal

  package-windows:
    name: Package Windows (win-x64)
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish single-file executable (win-x64)
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish src/Open-CDT-CLI/Open-CDT-CLI.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishDocumentationFile=false `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -p:Version=$version `
            -o publish/open-cdt

      - name: Bundle config, docs, and metadata
        shell: pwsh
        run: |
          Move-Item -Path publish/open-cdt/Open-CDT-CLI.exe -Destination publish/open-cdt/open-cdt.exe
          Copy-Item -Path config -Destination publish/open-cdt/config -Recurse
          Copy-Item -Path docs -Destination publish/open-cdt/docs -Recurse
          Copy-Item -Path README.md, LICENSE, CITATION.cff -Destination publish/open-cdt/
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path publish/open-cdt/* -DestinationPath "open-cdt-$tag-win-x64.zip"

      - name: Upload Windows release asset
        uses: actions/upload-artifact@v6
        with:
          name: win-x64-archive
          path: open-cdt-*-win-x64.zip

  package-linux:
    name: Package Linux (linux-x64)
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish single-file executable (linux-x64)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet publish src/Open-CDT-CLI/Open-CDT-CLI.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:PublishDocumentationFile=false \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -p:Version="$VERSION" \
            -o publish/open-cdt

      - name: Bundle config, docs, and metadata
        run: |
          mv publish/open-cdt/Open-CDT-CLI publish/open-cdt/open-cdt
          chmod +x publish/open-cdt/open-cdt
          cp -r config publish/open-cdt/config
          cp -r docs publish/open-cdt/docs
          cp README.md LICENSE CITATION.cff publish/open-cdt/
          TAG="${{ github.ref_name }}"
          tar -czvf "open-cdt-${TAG}-linux-x64.tar.gz" -C publish open-cdt

      - name: Upload Linux release asset
        uses: actions/upload-artifact@v6
        with:
          name: linux-x64-archive
          path: open-cdt-*-linux-x64.tar.gz

  create-github-release:
    name: Publish GitHub Release
    needs: [ package-windows, package-linux ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download packaged archives
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/open-cdt-*-win-x64.zip
            artifacts/open-cdt-*-linux-x64.tar.gz
